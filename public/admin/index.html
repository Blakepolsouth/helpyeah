<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · HelpYeah</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:0;background:var(--sunk);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
  .app{display:flex;flex-direction:column;gap:8px}.app dl{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:0;font-size:14px}.app dt{color:var(--muted)}.app dd{margin:0;word-break:break-word}
  .row{display:flex;gap:8px;flex-wrap:wrap}.row button,.row a{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
  .row .go{background:var(--green);border-color:var(--green);color:var(--card)}.row .del{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}
  .big{font-family:var(--f-head);font-size:30px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="/"><i aria-hidden="true">✓</i><b>Help<span>Yeah</span></b></a><span class="muted">Admin</span></header>
  <form class="card form" id="login"><h2 style="font-size:22px">Admin key</h2><input type="password" id="key" autocomplete="current-password" placeholder="The ADMIN_KEY you set in Netlify"><button class="next" type="submit">Open</button><p class="err" id="lerr" hidden></p></form>
  <div id="panel" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="tabs" role="tablist"><button data-t="pending" aria-selected="true">Pending</button><button data-t="live">Live</button><button data-t="demand">Demand</button><button data-t="wait">Waitlist</button></div>
    <div id="view" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
